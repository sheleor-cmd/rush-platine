name: Mise à jour Rush Platine

on:
  schedule:
    # minutes décalées : les créneaux :00/:15/:30/:45 sont saturés chez GitHub
    # et les crons y sont massivement ignorés sur les dépôts gratuits
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

concurrency:
  group: rush-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Installer Pillow (icônes de champions)
        run: pip install --quiet pillow

      - name: Relever OP.GG et mettre à jour la page
        id: maj
        run: |
          python update.py | tee resultat.txt
          echo "resultat=$(tail -1 resultat.txt)" >> "$GITHUB_OUTPUT"

      - name: Pousser si changement
        if: steps.maj.outputs.resultat == 'CHANGED'
        run: |
          git config user.name "rush-platine-bot"
          git config user.email "sheleor@gmail.com"
          git add index.html cache.json
          git commit -m "maj auto"
          git pull --rebase origin main || true
          git push origin main
